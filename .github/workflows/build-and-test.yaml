name: Integration

on:
  workflow_dispatch:
  pull_request:
  push:
    # branches: [main]

jobs:
  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # - name: Lint
      #   run: pnpm biome lint --diagnostic-level=error

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck
